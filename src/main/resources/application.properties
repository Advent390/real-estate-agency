# ============================================================
# real-estate-agency — application.properties
# Аналог db.py DB_CONFIG + app.run(...) з оригінального Flask-проєкту
# ============================================================

spring.application.name=real_estate_agency
server.port=5000

# --- PostgreSQL (замінити під свою локальну БД) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/real_estate_agency
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=update: Hibernate сам створює/оновлює таблиці за entity-класами
# (заміняє ручний schema.sql з оригінального проєкту).
# Дані наповнюються класом DataInitializer (заміняє init_db.py + seed.sql).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Кодування ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Сесії ---
server.servlet.session.timeout=30m

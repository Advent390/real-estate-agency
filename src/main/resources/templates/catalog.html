<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Метраж</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/common :: header(headerClass='')}"></div>

<section class="hero">
    <h1>Нерухомість у Миколаєві</h1>
    <p>Знайди свою квартиру, будинок або офіс</p>
</section>

<main class="container">
    <div th:replace="~{fragments/common :: flashes}"></div>

    <form method="get" class="filters">
        <div class="filters-grid">
            <div class="field">
                <label>Тип об'єкта</label>
                <select name="type_id">
                    <option value="">Усі</option>
                    <option th:each="t : ${types}"
                            th:value="${t.typeId}"
                            th:selected="${filters.typeId == t.typeId}"
                            th:text="${t.name}"></option>
                </select>
            </div>

            <div class="field">
                <label>Район</label>
                <select name="district_id">
                    <option value="">Усі</option>
                    <option th:each="d : ${districts}"
                            th:value="${d.districtId}"
                            th:selected="${filters.districtId == d.districtId}"
                            th:text="${d.name}"></option>
                </select>
            </div>

            <div class="field">
                <label>Кімнат</label>
                <select name="rooms">
                    <option value="">Будь-яка</option>
                    <option th:each="n : ${#numbers.sequence(1, 5)}"
                            th:value="${n}"
                            th:selected="${filters.rooms == n}"
                            th:text="${n}"></option>
                </select>
            </div>

            <div class="field">
                <label>Ціна від</label>
                <input type="number" name="min_price" step="1000"
                       th:value="${filters.minPrice}" placeholder="0">
            </div>

            <div class="field">
                <label>Ціна до</label>
                <input type="number" name="max_price" step="1000"
                       th:value="${filters.maxPrice}" placeholder="∞">
            </div>

            <div class="field">
                <label>Площа від (м²)</label>
                <input type="number" name="min_area" step="1"
                       th:value="${filters.minArea}" placeholder="0">
            </div>

            <div class="field">
                <label>Площа до (м²)</label>
                <input type="number" name="max_area" step="1"
                       th:value="${filters.maxArea}" placeholder="∞">
            </div>
        </div>

        <div class="filter-buttons">
            <button type="submit" class="btn">Знайти</button>
            <a th:href="@{/}" class="btn btn-outline">Скинути фільтри</a>
        </div>
    </form>

    <div class="objects-count">Знайдено об'єктів: <strong th:text="${objects.size()}"></strong></div>

    <div class="objects-grid" th:if="${!objects.isEmpty()}">
        <div class="card" th:each="o : ${objects}">
            <a th:href="@{/object/{id}(id=${o.objectId})}">
                <div class="card-img"
                     th:style="'background-image:url(' + (${o.mainPhoto} ?: '/img/placeholder.jpg') + ');'">
                    <span class="card-badge"
                          th:classappend="${o.archived} ? 'card-status-archived' : ''"
                          th:text="${o.type.name}"></span>
                </div>
            </a>
            <div class="card-body">
                <div class="card-title">
                    <a th:href="@{/object/{id}(id=${o.objectId})}"
                       th:text="${o.type.name} + ', ' + ${o.street} + ', ' + ${o.houseNumber}"></a>
                </div>
                <div class="card-meta">
                    <div class="card-meta-row">📍 <span th:text="${o.district.name}"></span> р-н</div>
                    <div class="card-meta-row">
                        📐 <span th:text="${o.totalArea}"></span> м²
                        <th:block th:if="${o.apartment != null}">
                            · <span th:text="${o.apartment.rooms}"></span> кімн. ·
                            <span th:text="${o.apartment.floor}"></span>/<span th:text="${o.apartment.totalFloors}"></span> пов.
                        </th:block>
                        <th:block th:if="${o.house != null}">
                            · <span th:text="${o.house.rooms}"></span> кімн. · ділянка
                            <span th:text="${o.house.plotArea}"></span> сот.
                        </th:block>
                        <th:block th:if="${o.office != null}">
                            · <span th:text="${o.office.roomsCount}"></span> прим. ·
                            <span th:text="${o.office.purpose}"></span>
                        </th:block>
                    </div>
                </div>
                <div class="card-price" th:text="${@priceFormatter.format(o.price)}"></div>
            </div>
        </div>
    </div>
    <div class="empty-state" th:if="${objects.isEmpty()}">
        <p>На жаль, нічого не знайдено за вашими параметрами.</p>
        <p style="margin-top:10px;"><a th:href="@{/}">Скинути фільтри</a></p>
    </div>
</main>

<div th:replace="~{fragments/common :: footer}"></div>
</body>
</html>

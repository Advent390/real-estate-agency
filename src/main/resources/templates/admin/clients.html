<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клієнти — Адмін</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/common :: header(headerClass='admin-header')}"></div>

<main class="container">
    <div th:replace="~{fragments/common :: flashes}"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
        <h1 class="section-title" style="margin:0;">Клієнти (<span th:text="${clients.size()}"></span>)</h1>
        <a th:href="@{/admin}" class="btn btn-outline">← До панелі</a>
    </div>

    <table class="data-table" th:if="${!clients.isEmpty()}">
        <thead>
            <tr>
                <th>#</th>
                <th>ПІБ</th>
                <th>Email</th>
                <th>Телефон</th>
                <th>Дата реєстрації</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${clients}">
                <td>#<span th:text="${c.clientId}"></span></td>
                <td><strong th:text="${c.fullName}"></strong></td>
                <td th:text="${c.email}"></td>
                <td th:text="${c.phone} ?: '—'"></td>
                <td th:text="${#temporals.format(c.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
            </tr>
        </tbody>
    </table>
    <div class="empty-state" th:if="${clients.isEmpty()}"><p>Клієнтів поки немає.</p></div>
</main>

<div th:replace="~{fragments/common :: footer}"></div>
</body>
</html>

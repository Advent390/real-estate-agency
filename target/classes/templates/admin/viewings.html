<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявки на перегляд — Адмін</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/common :: header(headerClass='admin-header')}"></div>

<main class="container">
    <div th:replace="~{fragments/common :: flashes}"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
        <h1 class="section-title" style="margin:0;">Заявки на перегляд</h1>
        <a th:href="@{/admin}" class="btn btn-outline">← До панелі</a>
    </div>

    <table class="data-table" th:if="${!viewings.isEmpty()}">
        <thead>
            <tr>
                <th>#</th>
                <th>Клієнт</th>
                <th>Об'єкт</th>
                <th>Дата перегляду</th>
                <th>Коментар</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="v : ${viewings}">
                <td>#<span th:text="${v.viewingId}"></span></td>
                <td>
                    <strong th:text="${v.client.fullName}"></strong><br>
                    <small style="color:var(--color-text-light);">
                        <span th:text="${v.client.email}"></span><br>
                        <span th:text="${v.client.phone} ?: '—'"></span>
                    </small>
                </td>
                <td>
                    <a th:href="@{/object/{id}(id=${v.realEstate.objectId})}"
                       th:text="${v.realEstate.type.name} + ', ' + ${v.realEstate.street} + ', ' + ${v.realEstate.houseNumber}"></a><br>
                    <small style="color:var(--color-text-light);" th:text="${@priceFormatter.format(v.realEstate.price)}"></small>
                </td>
                <td th:text="${#temporals.format(v.viewingDate, 'dd.MM.yyyy HH:mm')}"></td>
                <td style="max-width:250px;" th:text="${v.comment} ?: '—'"></td>
                <td>
                    <form method="post" th:action="@{/admin/viewings/{id}/status(id=${v.viewingId})}">
                        <select name="request_status" onchange="this.form.submit()" style="padding:5px;font-size:13px;">
                            <option value="нова" th:selected="${v.requestStatus == 'нова'}">нова</option>
                            <option value="підтверджена" th:selected="${v.requestStatus == 'підтверджена'}">підтверджена</option>
                            <option value="проведена" th:selected="${v.requestStatus == 'проведена'}">проведена</option>
                            <option value="скасована" th:selected="${v.requestStatus == 'скасована'}">скасована</option>
                        </select>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="empty-state" th:if="${viewings.isEmpty()}"><p>Заявок поки немає.</p></div>
</main>

<div th:replace="~{fragments/common :: footer}"></div>
</body>
</html>
